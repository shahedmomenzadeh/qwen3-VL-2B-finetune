[project]
name = "qwen3vl-finetune"
version = "0.1.0"
description = "Qwen3-VL-2B-Instruct SFT + GRPO finetuning for cataract surgery video understanding"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4.0",
    "torchvision",
    "torchaudio",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "deepspeed>=0.15.0",
    "bitsandbytes>=0.44.0",
    "qwen-vl-utils",
    "liger-kernel>=0.8.0",
    "ujson",
    "tensorboard",
    "wandb",
    "einops",
    "sentencepiece",
    "protobuf",
    "math-verify",
    "latex2sympy2-extended",
    "gradio",
    "pillow",
    "datasets",
]

[project.optional-dependencies]
flash-attn = ["flash-attn>=2.6.0"]

[tool.uv]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
