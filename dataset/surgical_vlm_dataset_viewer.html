<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surgical VLM · Unified Dataset Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #070a0e;
  --bg2:     #0c1017;
  --bg3:     #131b24;
  --bg4:     #192230;
  --border:  #1c2535;
  --border2: #273447;
  --text:    #dde6f0;
  --text2:   #8899ae;
  --text3:   #546e8c;
  --accent:  #29a8e0;
  --accent2: #22d3a4;
  --train:   #4ade80;
  --val:     #fbbf24;
  --test:    #f87171;
  --blue:    #3b82f6;
  --purple:  #a855f7;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

/* ── HEADER ─────────────────────────────────── */
.header {
  height: 54px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  flex-shrink: 0;
}

.logo {
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--accent2);
}
.logo em { color: var(--text3); font-style: normal; }

.h-sep { width: 1px; height: 24px; background: var(--border); }

.h-stats { display: flex; gap: 16px; flex: 1; align-items: center; }
.hst { font-family: var(--mono); font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--text3); }
.hst b { font-weight: 600; }
.hst b.tr { color: var(--train); }
.hst b.vl { color: var(--val); }
.hst b.te { color: var(--test); }
.hst b.wh { color: var(--text); }
.hst b.ck { color: var(--blue); }

.h-actions { display: flex; gap: 10px; }
.btn {
  font-family: var(--mono); font-size: 11px; padding: 8px 16px;
  border: 1px solid var(--border2); background: var(--bg3); color: var(--text2);
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg4); }
.btn.ok { border-color: rgba(34,211,164,.45); color: var(--accent2); }
.btn.ok:hover { border-color: var(--accent2); }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.primary:hover { background: #2563eb; border-color: #2563eb; color: #fff;}

/* YouTube Button */
.yt-btn {
  background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);
  font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
  text-decoration: none; display: inline-flex; align-items: center; text-transform: uppercase; 
  letter-spacing: 0.05em; transition: all 0.2s; margin-left: auto; gap: 6px;
}
.yt-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

/* ── BODY ───────────────────────────────────── */
.body { flex: 1; display: flex; overflow: hidden; }

/* ── SETUP SCREEN ───────────────────────────── */
.setup-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
.setup-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 48px; max-width: 600px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.s-eye { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text3); margin-bottom: 16px; text-align: center; }
.s-title { font-size: 32px; font-weight: 800; line-height: 1.15; margin-bottom: 16px; text-align: center; }
.s-title span { color: var(--accent2); }
.s-desc { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 36px; text-align: center; }

.s-steps { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.s-step { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; transition: border-color 0.2s; }
.s-step.done { border-color: rgba(34,211,164,.35); }
.s-num { width: 30px; height: 30px; border-radius: 50%; background: var(--bg4); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--text3); flex-shrink: 0; }
.s-step.done .s-num { background: rgba(34,211,164,.15); border-color: rgba(34,211,164,.4); color: var(--accent2); }
.s-info { flex: 1; min-width: 0; }
.s-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.s-file { font-family: var(--mono); font-size: 11px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-step.done .s-file { color: var(--accent2); }

.s-note { font-size: 12px; color: var(--text3); padding: 16px; background: var(--bg3); border-radius: 8px; border-left: 3px solid var(--border2); line-height: 1.5; margin-top: 10px; }

/* ── SIDEBAR ─────────────────────────────────── */
.sidebar { width: 280px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
.split-tabs { display: flex; border-bottom: 1px solid var(--border); }
.s-tab {
  flex: 1; padding: 14px 4px 12px; text-align: center; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text3);
}
.s-tab:hover { color: var(--text2); background: var(--bg3); }
.s-tab.active[data-t="train"] { color: var(--train); border-bottom-color: var(--train); background: rgba(74,222,128,.04); }
.s-tab.active[data-t="val"]   { color: var(--val);   border-bottom-color: var(--val);   background: rgba(251,191,36,.04); }
.s-tab.active[data-t="test"]  { color: var(--test);  border-bottom-color: var(--test);  background: rgba(248,113,113,.04);}

.sidebar-search { padding: 12px; border-bottom: 1px solid var(--border); }
.sidebar-search input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-family: var(--mono); font-size: 12px; color: var(--text2); outline: none;
}
.sidebar-search input:focus { border-color: var(--accent); }

.video-list { flex: 1; overflow-y: auto; padding: 8px; }
.vid-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.vid-item:hover { background: var(--bg3); }
.vid-item.active { background: var(--bg3); border-color: var(--border2); }
.vid-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.tab-train .vid-dot { background: var(--train); }
.tab-val   .vid-dot { background: var(--val);   }
.tab-test  .vid-dot { background: var(--test);  }

.vid-name { font-family: var(--mono); font-size: 11px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
.vid-item.active .vid-name { color: var(--text); font-weight: 600; }
.vid-cnt { font-family: var(--mono); font-size: 11px; color: var(--text3); background: var(--bg); padding: 2px 6px; border-radius: 10px; }

/* ── MIDDLE PANEL (CLIPS) ────────────────────── */
.clip-panel { width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; background: var(--bg); }
.panel-hdr { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 10px; }
.panel-hdr-title { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.panel-hdr-id { font-size: 9px; color: var(--text3); font-weight: 400; margin-top: 2px; }

.clip-list { flex: 1; overflow-y: auto; padding: 8px; }
.clip-item { padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; background: var(--bg2); transition: all 0.1s; }
.clip-item:hover { border-color: var(--border2); transform: translateY(-1px); }
.clip-item.active { background: var(--bg3); border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.clip-item.is-done { opacity: 0.6; }
.clip-item.is-done.active { opacity: 1; }

.clip-cb-wrapper { display: flex; align-items: flex-start; gap: 10px; }
.clip-cb { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; flex-shrink: 0; margin-top: 2px; }

.clip-info { flex: 1; min-width: 0; }
.clip-cid { font-family: var(--mono); font-size: 11px; color: var(--text); margin-bottom: 8px; word-break: break-all; }
.clip-stats { display: flex; gap: 8px; font-family: var(--mono); font-size: 10px; }
.c-badge { padding: 3px 8px; border-radius: 6px; border: 1px solid; font-weight: 500; }
.c-badge.sft { background: rgba(34,211,164,.1); border-color: rgba(34,211,164,.3); color: var(--accent2); }
.c-badge.grpo { background: rgba(168,85,247,.1); border-color: rgba(168,85,247,.3); color: var(--purple); }

/* ── RIGHT PANEL (DETAIL) ────────────────────── */
.detail-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text3); }
.empty-ico { font-size: 48px; opacity: 0.2; }
.empty-lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }

.d-content { flex: 1; overflow-y: auto; padding: 32px 40px; display: flex; flex-direction: column; gap: 32px; }

/* Video Player */
.video-wrapper { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
video { width: 100%; max-height: 450px; display: block; outline: none; }
.no-video { padding: 60px 40px; text-align: center; color: var(--test); font-family: var(--mono); font-size: 12px; background: rgba(248,113,113,.05); border-radius: 12px; border: 1px dashed rgba(248,113,113,.3); line-height: 1.6; }

/* Section Headers */
.sec-title { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.sec-badge { font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: 600; letter-spacing: 0.1em; }
.sec-badge.sft { background: var(--accent2); color: #000; }
.sec-badge.grpo { background: var(--purple); color: #fff; }
.sec-badge.meta { background: var(--blue); color: #fff; }

/* Metadata Card */
.ctx-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: -10px; }
.c-step { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
.c-desc { font-size: 14px; line-height: 1.7; color: var(--text); margin-bottom: 16px; padding: 16px; background: var(--bg3); border-radius: 8px; border-left: 3px solid var(--blue); }

.c-transcript { font-size: 13px; line-height: 1.6; color: var(--text2); margin-bottom: 20px; padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid var(--text3); font-style: italic; }
.c-transcript::before { content: 'Transcript Context:'; font-weight: 600; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); display: block; margin-bottom: 6px; font-style: normal; }

.c-tags { display: flex; flex-direction: column; gap: 10px; }
.tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.t-lbl { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; width: 90px; }
.tag { font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid; }
.tag.inst { background: rgba(41,168,224,.08); border-color: rgba(41,168,224,.3); color: var(--accent); }
.tag.anat { background: rgba(34,211,164,.08); border-color: rgba(34,211,164,.3); color: var(--accent2); }

/* SFT Chat Cards */
.chat-box { display: flex; flex-direction: column; gap: 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.msg { display: flex; flex-direction: column; gap: 8px; max-width: 92%; }
.msg.user { align-self: flex-start; }
.msg.asst { align-self: flex-end; }
.msg-role { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.msg.asst .msg-role { text-align: right; color: var(--accent); }
.msg-bubble { padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; font-family: var(--sans); }
.msg.user .msg-bubble { background: var(--bg3); border: 1px solid var(--border2); border-bottom-left-radius: 4px; }
.msg.asst .msg-bubble { background: rgba(41,168,224,.08); border: 1px solid rgba(41,168,224,.2); border-bottom-right-radius: 4px; }

/* GRPO Cards */
.grpo-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.grpo-hdr { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
.g-tag { font-family: var(--mono); font-size: 11px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border2); color: var(--text2); background: var(--bg3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;}
.g-reward { font-family: var(--mono); font-size: 11px; color: var(--val); display: flex; align-items: center; gap: 8px; background: rgba(251,191,36,.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(251,191,36,.3);}

.g-q { font-size: 15px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; color: #fff; white-space: pre-wrap; background: var(--bg3); padding: 16px; border-radius: 8px; border: 1px solid var(--border2); }
.g-ans-box { background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.3); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; }
.g-ans-lbl { font-family: var(--mono); font-size: 11px; color: var(--train); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;}
.g-ans-val { font-size: 18px; font-weight: 800; color: #fff; }

.g-reasoning { background: var(--bg3); border-radius: 8px; padding: 18px 20px; font-size: 14px; line-height: 1.7; color: var(--text2); border-left: 4px solid var(--purple); }
.g-r-lbl { font-family: var(--mono); font-size: 11px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.1em; font-weight: 600; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Surgical<em>VLM</em> · Dataset Viewer</div>
  <div class="h-sep"></div>
  <div class="h-stats" id="hstats"></div>
  <div class="h-actions">
    <button class="btn primary" id="btn-load-unified" onclick="pickUnifiedDir()">📁 Load Unified Dataset</button>
  </div>
</div>

<div class="body" id="body"></div>

<script>
/* ─────────────────── STATE ─────────────────── */
let dataStore = { train: {}, val: {}, test: {} };
let fileRegistry = {}; // Store exact full relative paths for MP4s
let clipMetadata = {}; // Store visual_description, etc. from clip_xx.jsonl
let parentMetaCache = {}; // Cache map for YouTube ID -> Actual Video Title & URL

let activeTab = 'train';
let activeParent = null;
let activeClip = null;
let searchQ = '';
let currentVideoUrl = null;

let isDatasetLoaded = false;

// Progress tracking with LocalStorage
const LS_KEY = 'surgical_vlm_reviewed';
let checkedClips = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));

/* ─────────────────── DATA LOADING ──────────── */
async function pickUnifiedDir() {
  try {
    const dh = await window.showDirectoryPicker();
    
    // Reset state
    dataStore = { train: {}, val: {}, test: {} };
    fileRegistry = {};
    clipMetadata = {};
    parentMetaCache = {};
    
    const btn = document.getElementById('btn-load-unified');
    if (btn) btn.textContent = '⏳ Scanning...';
    
    await scanUnifiedDir(dh, '');
    
    isDatasetLoaded = true;
    if (btn) {
      btn.textContent = '✓ Dataset Loaded';
      btn.classList.add('ok');
      btn.classList.remove('primary');
    }

    // Auto-select tab with data
    if (Object.keys(dataStore.train).length > 0) activeTab = 'train';
    else if (Object.keys(dataStore.val).length > 0) activeTab = 'val';
    else if (Object.keys(dataStore.test).length > 0) activeTab = 'test';
    
    renderAll();
  } catch(e) {
    if (e.name !== 'AbortError') alert('Error reading dataset directory:\n' + e.message);
    const btn = document.getElementById('btn-load-unified');
    if (btn) btn.textContent = '📁 Load Unified Dataset';
  }
}

async function scanUnifiedDir(dirHandle, currentPath = '') {
  for await (const [name, handle] of dirHandle.entries()) {
    const relPath = currentPath ? `${currentPath}/${name}` : name;
    
    if (handle.kind === 'directory') {
      await scanUnifiedDir(handle, relPath);
    } else if (handle.kind === 'file') {
      
      // Determine Split
      const lowerPath = relPath.toLowerCase();
      let split = 'train';
      if (lowerPath.includes('/validation/') || lowerPath.startsWith('validation/')) split = 'val';
      else if (lowerPath.includes('/test/') || lowerPath.startsWith('test/')) split = 'test';
      
      // Extract Parent and Filename
      const parts = relPath.split('/');
      if (parts.length >= 2) {
        const fileName = parts[parts.length - 1];
        const parentName = parts[parts.length - 2]; // This is now the YouTube ID
        
        const isMp4 = fileName.match(/\.(mp4|avi|mov|mkv|webm|m4v|mpg|mpeg)$/i);
        const isSft = fileName.endsWith('_sft.jsonl');
        const isGrpo = fileName.endsWith('_grpo.jsonl');
        const isMeta = fileName.endsWith('.jsonl') && !isSft && !isGrpo;
        
        if (isMp4) {
          fileRegistry[relPath] = await handle.getFile();
        } else if (isSft || isGrpo || isMeta) {
          try {
            const file = await handle.getFile();
            const text = await file.text();
            const lines = text.split('\n').filter(Boolean);
            
            if (isMeta && lines.length > 0) {
              const parsedMeta = JSON.parse(lines[0]);
              clipMetadata[relPath] = parsedMeta;
              
              // Cache parent title and url mapping based on the YouTube ID
              if (!parentMetaCache[parentName]) {
                parentMetaCache[parentName] = {
                  title: parsedMeta.parent_video_title || parentName,
                  url: parsedMeta.parent_video_url || `https://youtube.com/watch?v=${parentName}`
                };
              }
              
            } else if ((isSft || isGrpo) && lines.length > 0) {
              const type = isSft ? 'sft' : 'grpo';
              const clipBaseName = fileName.replace(`_${type}.jsonl`, '');
              
              // Logical video path
              const logicalVideoPath = `${parentName}/${clipBaseName}.mp4`;
              
              // Init structure
              if (!dataStore[split][parentName]) dataStore[split][parentName] = {};
              if (!dataStore[split][parentName][logicalVideoPath]) {
                dataStore[split][parentName][logicalVideoPath] = { 
                  path: logicalVideoPath, 
                  clipName: clipBaseName, 
                  sft: [], 
                  grpo: [] 
                };
              }
              
              for (let line of lines) {
                try {
                  dataStore[split][parentName][logicalVideoPath][type].push(JSON.parse(line));
                } catch(e) {}
              }
            }
          } catch (e) {
            console.warn("Failed to parse", relPath, e);
          }
        }
      }
    }
  }
}

/* ─────────────────── GETTERS & STATE ────────── */
function hasData() {
  return Object.keys(dataStore.train).length > 0 || 
         Object.keys(dataStore.val).length > 0 || 
         Object.keys(dataStore.test).length > 0;
}

function getParents(tab) {
  let ids = Object.keys(dataStore[tab] || {});
  
  // Enable search by YouTube ID OR actual human-readable Title
  if (searchQ) {
    const q = searchQ.toLowerCase();
    ids = ids.filter(id => {
      const meta = parentMetaCache[id] || {};
      const title = (meta.title || id).toLowerCase();
      return id.toLowerCase().includes(q) || title.includes(q);
    });
  }
  
  // Sort alphabetically by the actual video title, not the random ID
  return ids.sort((a, b) => {
    const titleA = parentMetaCache[a]?.title || a;
    const titleB = parentMetaCache[b]?.title || b;
    return titleA.localeCompare(titleB);
  });
}

function getClips(parent) {
  if (!parent) return [];
  return Object.values(dataStore[activeTab][parent] || {}).sort((a, b) => a.clipName.localeCompare(b.clipName));
}

function getClipData() {
  if (!activeParent || !activeClip) return null;
  return dataStore[activeTab][activeParent][activeClip];
}

/* ─────────────────── ACTIONS ────────────────── */
function switchTab(tab) { activeTab = tab; activeParent = null; activeClip = null; renderAll(); }
function selectParent(vid) { activeParent = vid; activeClip = null; renderAll(); }

function selectClip(clipPath) { 
  activeClip = clipPath; 
  if (currentVideoUrl) {
    URL.revokeObjectURL(currentVideoUrl);
    currentVideoUrl = null;
  }
  renderAll(); 
}

function toggleCheck(clipPath, ev) {
  ev.stopPropagation(); 
  if (checkedClips.has(clipPath)) checkedClips.delete(clipPath);
  else checkedClips.add(clipPath);
  
  localStorage.setItem(LS_KEY, JSON.stringify([...checkedClips]));
  renderAll();
}

/* ─────────────────── RENDER ─────────────────── */
function renderAll() {
  renderHeader();
  const body = document.getElementById('body');
  
  if (!isDatasetLoaded) {
    body.innerHTML = renderSetup();
    return;
  }
  
  body.innerHTML = renderSidebar() + renderClipPanel() + renderDetail();
  bindEvents();
}

function renderHeader() {
  const el = document.getElementById('hstats');
  if (!isDatasetLoaded) { el.innerHTML = ''; return; }
  
  let totalClips = 0;
  let reviewedClips = 0;

  const countClips = (split) => {
    let count = 0;
    Object.values(dataStore[split]).forEach(p => {
      Object.keys(p).forEach(clipPath => {
        count++;
        totalClips++;
        if (checkedClips.has(clipPath)) reviewedClips++;
      });
    });
    return count;
  };
  
  el.innerHTML =
    `<div class="hst">TRAIN <b class="tr">${countClips('train')}</b> clips</div>` +
    `<div class="hst">VAL <b class="vl">${countClips('val')}</b> clips</div>` +
    `<div class="hst">TEST <b class="te">${countClips('test')}</b> clips</div>` +
    `<div class="hst" style="margin-left: 20px; border-left: 1px solid var(--border2); padding-left: 16px;">REVIEWED <b class="ck">${reviewedClips}</b> / <b class="wh">${totalClips}</b></div>`;
}

function renderSetup() {
  return `<div class="setup-wrap"><div class="setup-card">
    <div class="s-eye">Local File System Access Required</div>
    <div class="s-title">Load your <span>Dataset</span></div>
    <div class="s-desc">Select your newly merged unified dataset folder (containing Train/Validation/Test folders) to start reviewing.</div>
    
    <div class="s-steps">
      <div class="s-step ${isDatasetLoaded ? 'done' : ''}">
        <div class="s-num">${isDatasetLoaded ? '✓' : '1'}</div>
        <div class="s-info">
          <div class="s-label">Unified Dataset Directory</div>
          <div class="s-file">${isDatasetLoaded ? 'Loaded Files' : 'Select the main dataset folder'}</div>
        </div>
        <button class="btn ${isDatasetLoaded ? 'ok' : 'primary'}" onclick="pickUnifiedDir()">${isDatasetLoaded ? '✓ Loaded' : 'Select Folder'}</button>
      </div>
    </div>
    
    <div class="s-note">💡 <b>Note:</b> Select the newly merged <code>dataset</code> folder. The tool will automatically parse the Train/Validation/Test splits, linking MP4s, SFT/GRPO jsonls, and metadata together.</div>
  </div></div>`;
}

function renderSidebar() {
  const tabsHtml = ['train', 'val', 'test'].map(t => {
    const cnt = Object.keys(dataStore[t]).length;
    return `<div class="s-tab ${activeTab===t?'active':''}" data-t="${t}">${t}<br><span style="opacity:0.5; font-size: 9px; margin-top:4px; display:block;">${cnt} videos</span></div>`;
  }).join('');

  const parents = getParents(activeTab);
  const vidsHtml = parents.length === 0
    ? `<div style="padding:20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3);">No videos found for this split</div>`
    : parents.map(vid => {
        const clipsObj = dataStore[activeTab][vid];
        const tot = Object.keys(clipsObj).length;
        const done = Object.keys(clipsObj).filter(cp => checkedClips.has(cp)).length;
        
        // Grab the human readable title
        const meta = parentMetaCache[vid] || { title: vid };
        const displayTitle = meta.title;
        
        return `<div class="vid-item tab-${activeTab} ${activeParent===vid?'active':''}" data-vid="${escHtml(vid)}">
          <div class="vid-dot"></div>
          <div class="vid-name" title="${escHtml(displayTitle)}">${escHtml(displayTitle)}</div>
          <div class="vid-cnt" style="${done === tot ? 'color: var(--accent2); background: rgba(34,211,164,0.1); border: 1px solid rgba(34,211,164,0.2);' : ''}">${done}/${tot}</div>
        </div>`;
      }).join('');

  return `<div class="sidebar">
    <div class="split-tabs">${tabsHtml}</div>
    <div class="sidebar-search"><input id="sb-search" type="text" placeholder="Search title or ID…" value="${escHtml(searchQ)}"></div>
    <div class="video-list">${vidsHtml}</div>
  </div>`;
}

function renderClipPanel() {
  if (!activeParent) return `<div class="clip-panel"></div>`;
  
  const meta = parentMetaCache[activeParent] || { title: activeParent };
  const displayTitle = meta.title;

  const clips = getClips(activeParent);
  const clipsHtml = clips.map(c => {
    const isAc = activeClip === c.path;
    const isCk = checkedClips.has(c.path);
    
    return `<div class="clip-item ${isAc?'active':''} ${isCk?'is-done':''}" data-cid="${escHtml(c.path)}">
      <div class="clip-cb-wrapper">
        <input type="checkbox" class="clip-cb" data-cid="${escHtml(c.path)}" ${isCk?'checked':''}>
        <div class="clip-info">
          <div class="clip-cid">${escHtml(c.clipName)}</div>
          <div class="clip-stats">
            ${c.sft.length ? `<span class="c-badge sft">${c.sft.length} SFT</span>` : ''}
            ${c.grpo.length ? `<span class="c-badge grpo">${c.grpo.length} GRPO</span>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="clip-panel">
    <div class="panel-hdr">
      <div style="flex:1; min-width:0;">
        <div class="panel-hdr-title" title="${escHtml(displayTitle)}">${escHtml(displayTitle)}</div>
        <div class="panel-hdr-id">ID: ${escHtml(activeParent)}</div>
      </div>
    </div>
    <div class="clip-list">${clipsHtml}</div>
  </div>`;
}

function renderDetail() {
  if (!activeClip) {
    return `<div class="detail-panel"><div class="empty-state">
      <div class="empty-ico">🎬</div>
      <div class="empty-lbl">Select a clip to view generated VLM data</div>
    </div></div>`;
  }

  const clipData = getClipData();
  
  // Normalise the path from the dataset
  const targetPath     = clipData.path.replace(/\\/g, '/').toLowerCase();
  const targetName     = targetPath.split('/').pop();                        // "clip_01.mp4"
  const targetBaseName = targetName.replace(/\.[^/.]+$/, '');               // "clip_01"
  // Full-path equivalent for the sidecar metadata file
  const metaTargetPath = targetPath.replace(/\.[^/.]+$/, '.jsonl');         // "parent/clip_01.jsonl"
  const metaTargetName = targetBaseName + '.jsonl';                          // "clip_01.jsonl" (fallback)

  // 1. Find the video file
  let fileObj = null;
  for (const [key, f] of Object.entries(fileRegistry)) {
    const kLower = key.replace(/\\/g, '/').toLowerCase();
    if (kLower === targetPath || kLower.endsWith('/' + targetPath)) {
      fileObj = f; break;
    }
  }
  if (!fileObj) {
    for (const [key, f] of Object.entries(fileRegistry)) {
      const kLower = key.replace(/\\/g, '/').toLowerCase();
      if (kLower.endsWith('/' + targetName) || kLower === targetName) {
        fileObj = f; break;
      }
    }
  }

  // 2. Find the sidecar metadata
  let metaObj = {};
  let foundMetaKey = null;
  for (const [key, obj] of Object.entries(clipMetadata)) {
    const kLower = key.replace(/\\/g, '/').toLowerCase();
    if (kLower === metaTargetPath || kLower.endsWith('/' + metaTargetPath)) {
      metaObj = obj; foundMetaKey = key; break;
    }
  }
  if (!foundMetaKey) {
    for (const [key, obj] of Object.entries(clipMetadata)) {
      const kLower = key.replace(/\\/g, '/').toLowerCase();
      const objFileMatch = obj.clip_filename && obj.clip_filename.toLowerCase() === targetName;
      if (kLower.endsWith('/' + metaTargetName) || kLower === metaTargetName || objFileMatch) {
        metaObj = obj; foundMetaKey = key; break;
      }
    }
  }

  // Build the Video HTML block
  let videoHtml = `<div class="no-video" style="text-align: left;">
    <div style="text-align:center; font-size:14px; margin-bottom:16px;"><b>Video file missing or not matched.</b></div>
    Looking for: <code>${escHtml(targetBaseName + '.mp4')}</code>
    ${foundMetaKey ? `<br>Metadata found at: <code>${escHtml(foundMetaKey)}</code>` : '<br>No matching metadata file found either.'}
  </div>`;
  
  if (fileObj) {
    if(!currentVideoUrl) currentVideoUrl = URL.createObjectURL(fileObj);
    videoHtml = `<div class="video-wrapper"><video controls autoplay muted src="${currentVideoUrl}"></video></div>`;
  }

  // Build the Metadata block
  let contextHtml = '';
  if (metaObj.visual_description) {
    
    // YouTube Link logic
    const ytUrl = metaObj.parent_video_url || (activeParent ? `https://youtube.com/watch?v=${activeParent}` : null);
    const ytLink = ytUrl ? `<a href="${escHtml(ytUrl)}" target="_blank" class="yt-btn">▶ Watch on YouTube</a>` : '';

    // Build Transcript snippet if it exists
    let transcriptHtml = '';
    if (metaObj.transcript_context && metaObj.transcript_context.trim() !== '') {
      transcriptHtml = `<div class="c-transcript">"${escHtml(metaObj.transcript_context)}"</div>`;
    }

    contextHtml = `
      <div class="ctx-card">
        <div class="sec-title" style="margin-bottom: 20px;">
          Original Context <span class="sec-badge meta">METADATA</span>
          ${ytLink}
        </div>
        <div class="c-step">${escHtml(metaObj.step_title || 'Clip Analysis')}</div>
        <div class="c-desc">${escHtml(metaObj.visual_description)}</div>
        ${transcriptHtml}
        <div class="c-tags">
          ${metaObj.instruments && metaObj.instruments.length ? `<div class="tag-row"><span class="t-lbl">Instruments:</span> ${metaObj.instruments.map(i => `<span class="tag inst">${escHtml(i)}</span>`).join('')}</div>` : ''}
          ${metaObj.anatomy && metaObj.anatomy.length ? `<div class="tag-row"><span class="t-lbl">Anatomy:</span> ${metaObj.anatomy.map(a => `<span class="tag anat">${escHtml(a)}</span>`).join('')}</div>` : ''}
        </div>
      </div>
    `;
  }

  // Build SFT Blocks
  const sftHtml = clipData.sft.map(s => {
    const msgs = s.messages.map(m => {
      let content = '';
      if (Array.isArray(m.content)) {
        content = m.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
      } else {
        content = m.content;
      }
      const role = m.role === 'user' ? 'user' : 'asst';
      return `<div class="msg ${role}">
        <div class="msg-role">${escHtml(m.role)}</div>
        <div class="msg-bubble">${escHtml(content)}</div>
      </div>`;
    }).join('');
    return `<div class="chat-box">${msgs}</div>`;
  }).join('');

  // Build GRPO Blocks
  const grpoHtml = clipData.grpo.map(g => {
    let promptText = '';
    if (Array.isArray(g.prompt) && g.prompt[0] && Array.isArray(g.prompt[0].content)) {
      promptText = g.prompt[0].content.filter(c => c.type === 'text').map(c => c.text).join('\n');
    }
    
    return `<div class="grpo-card">
      <div class="grpo-hdr">
        <div class="g-tag">${escHtml(g.question_type || 'Reasoning Task')}</div>
        <div class="g-reward">🏆 Reward Rule: ${escHtml(g.reward_type || 'N/A')}</div>
      </div>
      <div class="g-q">${escHtml(promptText)}</div>
      <div class="g-ans-box">
        <div class="g-ans-lbl">Correct Target Answer:</div>
        <div class="g-ans-val">${escHtml(g.correct_answer)}</div>
      </div>
      <div class="g-reasoning">
        <div class="g-r-lbl">Reference LLM Reasoning Guide</div>
        ${escHtml(g.reference_reasoning)}
      </div>
    </div>`;
  }).join('');

  return `<div class="detail-panel">
    <div class="d-content">
      <div>
        <div class="sec-title">Video Playback <span class="sec-badge" style="background:var(--bg4);color:var(--text2);border:1px solid var(--border2);">MP4</span></div>
        ${videoHtml}
      </div>
      ${contextHtml}
      
      ${clipData.sft.length > 0 ? `
        <div>
          <div class="sec-title">Supervised Fine-Tuning <span class="sec-badge sft">SFT</span></div>
          ${sftHtml}
        </div>
      ` : ''}

      ${clipData.grpo.length > 0 ? `
        <div>
          <div class="sec-title">Generative Reward Optimization <span class="sec-badge grpo">GRPO</span></div>
          ${grpoHtml}
        </div>
      ` : ''}
    </div>
  </div>`;
}

/* ─────────────────── BIND EVENTS ────────────── */
function bindEvents() {
  document.querySelectorAll('.s-tab').forEach(el =>
    el.addEventListener('click', () => switchTab(el.dataset.t)));

  const sbSearch = document.getElementById('sb-search');
  if (sbSearch) sbSearch.addEventListener('input', e => { searchQ = e.target.value; renderAll(); });

  document.querySelectorAll('.vid-item').forEach(el =>
    el.addEventListener('click', () => selectParent(el.dataset.vid)));

  document.querySelectorAll('.clip-item').forEach(el =>
    el.addEventListener('click', () => selectClip(el.dataset.cid)));

  document.querySelectorAll('.clip-cb').forEach(cb =>
    cb.addEventListener('change', e => toggleCheck(cb.dataset.cid, e)));
}

/* ─────────────────── UTILS ─────────────────── */
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─────────────────── BOOT ───────────────────── */
renderAll();
</script>
</body>
</html>
