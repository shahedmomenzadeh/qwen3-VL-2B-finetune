# SFT Configuration
# Default hyperparameters for QLoRA + LoRA SFT training

# Model
model_id: "Qwen/Qwen3-VL-2B-Instruct"
bits: 8                          # 8-bit QLoRA
lora_enable: true
vision_lora: true               # Include vision in LoRA
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
num_lora_modules: -1            # All linear layers
lora_namespan_exclude: "['lm_head', 'embed_tokens']"

# Freezing
freeze_vision_tower: false
freeze_llm: true                 # Required with LoRA
freeze_merger: false

# Precision
bf16: true
fp16: false
tf32: true

# Attention
disable_flash_attn2: false

# Learning
learning_rate: 1e-4
vision_lr: 2e-6
merger_lr: 1e-5
weight_decay: 0.1
warmup_steps: 10
lr_scheduler_type: "cosine"
num_train_epochs: 2

# Batch
per_device_train_batch_size: 2
gradient_accumulation_steps: 4   # global_bs = 2 * 4 * num_gpus
dataloader_num_workers: 4

# Video
video_min_pixels: 131072         # 128 * 32 * 32
video_max_pixels: 262144         # 256 * 32 * 32
fps: 1

# Logging & saving
logging_steps: 1
save_strategy: "steps"
save_steps: 500
save_total_limit: 3
report_to: "tensorboard"

# Misc
gradient_checkpointing: true
lazy_preprocess: true

# Evaluation
eval_strategy: "steps"
eval_steps: 500
per_device_eval_batch_size: 1
generation_max_new_tokens: 256
prediction_loss_only: false
